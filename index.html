<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Bottlenaxe - LLink</title>
    <link rel="icon" type="image/x-icon" href="/images/avatar.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Naxe's LittleLink - A simple link page to showcase my projects and social media.">

    <!-- Keywords -->
    <meta name="keywords" content="Naxe, web development, coding, portfolio, links, social media">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <!-- <meta rel="canonical" href="https://yourwebsite.com"> -->

    <!-- Author Information -->
    <meta name="author" content="Bottlenaxe">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/avatar.jpg" srcset="images/avatar@2x.jpg 2x" alt="Naxe's Avatar">

            <!-- Replace with your name or brand -->
            <h2>
              <div>renamamiyaaslimbantul</div>
            </h2>

            <!-- Add a short description about yourself or your brand -->
            <p>Learning to code and build projects.</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <!-- GitHub -->
              <a class="button button-github" href="https://github.com/renamamiyaaslimbantul/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/github.svg" alt="GitHub Logo">GitHub</a>

              <a class="button button-github" href="https://spoo.me/naxeporto" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/github.svg" alt="GitHub Logo">Portfolio</a>

              <!-- Discord -->

              <!-- Discord -->
              <!-- <a class="button button-discord" href="#" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/discord.svg" alt="Discord Logo">Discord</a> -->

              <!-- Buy Me A Coffee -->
              <!-- <a class="button button-coffee" href="#" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/buy-me-a-coffee.svg" alt="Buy Me A Coffee Logo">Buy Me A Coffee</a> -->

              <!-- Ko-fi -->
              <a class="button button-ko-fi" href="https://ko-fi.com/bottlenaxe" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/ko-fi.svg" alt="Ko-fi Logo">Support me on Ko-fi</a>

              <!-- Reddit -->
              <a class="button button-reddit" href="https://www.reddit.com/user/bottlenaxe/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/reddit.svg" alt="Reddit Logo">Reddit</a>

              <!-- Spotify Alt -->
              <a class="button button-spotify-alt" href="https://open.spotify.com/user/31w2eqxhxrgko7xvunletba5pk74" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/spotify-alt.svg" alt="Spotify Logo">Listen on Spotify</a>

              <!-- Steam Alt -->
              <a class="button button-steam-alt" href="https://steamcommunity.com/id/bottlenaxe/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/steam.svg" alt="Steam Logo">Steam</a>

              <!-- YouTube -->
              <!-- <a class="button button-yt" href="#" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/youtube.svg" alt="YouTube Logo">YouTube</a> -->

      </div>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        Hiii!! Thanks for visiting my LittleLink! <br>
      </footer>

    </div>
  </div>

</body>

</html>
